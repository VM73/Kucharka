function nactiObrazek(blob) {
  return new Promise((ok, chyba) => {
    const url = URL.createObjectURL(blob); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); chyba(new Error('Obrázek nejde načíst')); };
    img.src = url;
  });
}
async function zmensi(blob, max = 1600) {
  const img = await nactiObrazek(blob);
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.85));
}
async function otoc(blob) {
  const img = await nactiObrazek(blob);
  const c = document.createElement('canvas'); c.width = img.naturalHeight; c.height = img.naturalWidth;
  const x = c.getContext('2d'); x.translate(c.width, 0); x.rotate(Math.PI / 2); x.drawImage(img, 0, 0);
  return await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.88));
}

function vytvorSupabaseApi() {
  // Vlastní úložiště relace (obchází blokování localStorage, např. Avast AntiTrack)
  const pamet = {};
  const uloziste = {
    getItem: (k) => { if (k in pamet) return pamet[k]; try { return localStorage.getItem(k); } catch (e) { return null; } },
    setItem: (k, v) => { pamet[k] = v; setTimeout(() => { try { localStorage.setItem(k, v); } catch (e) { /* ignorovat */ } }, 0); },
    removeItem: (k) => { delete pamet[k]; setTimeout(() => { try { localStorage.removeItem(k); } catch (e) { /* ignorovat */ } }, 0); },
  };
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: uloziste, storageKey: 'kucharka-auth', persistSession: true, autoRefreshToken: true } });
  const urlCache = new Map();
  const ok = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
  return {
    async relace() { const { data } = await sb.auth.getSession(); return data.session; },
    async prihlasit(email, heslo) { ok(await sb.auth.signInWithPassword({ email, password: heslo })); },
    async odhlasit() { await sb.auth.signOut(); },
    async clen() {
      const s = await this.relace(); if (!s) return null;
      const d = ok(await sb.from('clenove').select('jmeno, role').eq('user_id', s.user.id).maybeSingle());
      return d ? { ...d, email: s.user.email } : { jmeno: null, role: null, email: s.user.email };
    },
    async nactiVse() {
      const [kategorie, osoby, zdroje, recepty, stranky, fotky] = await Promise.all([
        sb.from('kategorie').select('*').order('poradi'),
        sb.from('osoby').select('*').order('jmeno'),
        sb.from('zdroje').select('*').order('nazev'),
        sb.from('recepty').select('id, nazev, kategorie_id, autor_id, zdroj_id, porce, stitky, stav, navrh, vytvoreno, upraveno').order('vytvoreno', { ascending: false }),
        sb.from('stranky').select('recept_id, cesta, poradi').order('poradi'),
        sb.from('fotky_pokrmu').select('recept_id, cesta, poradi').order('poradi'),
      ].map((p) => p.then(ok)));
      return { kategorie, osoby, zdroje, recepty, stranky, fotky };
    },
    async hledej(dotaz) { return ok(await sb.rpc('hledej_recepty', { dotaz })).map((r) => r.id); },
    async detail(id) {
      const [r, sur, str, fot] = await Promise.all([
        sb.from('recepty').select('*').eq('id', id).single(),
        sb.from('suroviny').select('*').eq('recept_id', id).order('poradi'),
        sb.from('stranky').select('*').eq('recept_id', id).order('poradi'),
        sb.from('fotky_pokrmu').select('*').eq('recept_id', id).order('poradi'),
      ].map((p) => p.then(ok)));
      return { ...r, suroviny: sur, stranky: str, fotky: fot };
    },
    async novyRecept(pole) { return ok(await sb.from('recepty').insert(pole).select('id').single()).id; },
    async ulozRecept(id, pole, suroviny) {
      if (suroviny) {
        ok(await sb.from('suroviny').delete().eq('recept_id', id));
        if (suroviny.length) ok(await sb.from('suroviny').insert(suroviny.map((s, i) => ({ ...s, recept_id: id, poradi: i }))));
      }
      ok(await sb.from('recepty').update(pole).eq('id', id));
    },
    async smazRecept(id) {
      const d = await this.detail(id);
      const s = d.stranky.map((x) => x.cesta); const f = d.fotky.map((x) => x.cesta);
      ok(await sb.from('recepty').delete().eq('id', id));
      if (s.length) await sb.storage.from('stranky').remove(s);
      if (f.length) await sb.storage.from('pokrmy').remove(f);
    },
    async nahraj(bucket, receptId, blob) {
      const cesta = `${receptId}/${noveId()}.jpg`;
      ok(await sb.storage.from(bucket).upload(cesta, blob, { contentType: 'image/jpeg' }));
      return cesta;
    },
    async prepisSoubor(bucket, cesta, blob) {
      ok(await sb.storage.from(bucket).upload(cesta, blob, { contentType: 'image/jpeg', upsert: true }));
      urlCache.delete(bucket + '/' + cesta);
    },
    async stahni(bucket, cesta) { return ok(await sb.storage.from(bucket).download(cesta)); },
    async pridejStranku(receptId, blob, poradi) {
      const cesta = await this.nahraj('stranky', receptId, blob);
      return ok(await sb.from('stranky').insert({ recept_id: receptId, cesta, poradi }).select('*').single());
    },
    async smazStranku(s) { ok(await sb.from('stranky').delete().eq('id', s.id)); await sb.storage.from('stranky').remove([s.cesta]); },
    async poradiStranek(seznam) { for (const [i, s] of seznam.entries()) ok(await sb.from('stranky').update({ poradi: i }).eq('id', s.id)); },
    async pridejFotku(receptId, blob, poradi) {
      const cesta = await this.nahraj('pokrmy', receptId, blob);
      return ok(await sb.from('fotky_pokrmu').insert({ recept_id: receptId, cesta, poradi }).select('*').single());
    },
    async smazFotku(f) { ok(await sb.from('fotky_pokrmu').delete().eq('id', f.id)); await sb.storage.from('pokrmy').remove([f.cesta]); },
    async novaOsoba(jmeno) { return ok(await sb.from('osoby').insert({ jmeno }).select('*').single()); },
    async novyZdroj(nazev) { return ok(await sb.from('zdroje').insert({ nazev }).select('*').single()); },
    async novaKategorie(nazev, rodic_id) { return ok(await sb.from('kategorie').insert({ nazev, rodic_id, poradi: 99 }).select('*').single()); },
    async prepis(receptId) {
      const s = await this.relace();
      const r = await fetch(`${SUPABASE_URL}/functions/v1/${FUNKCE}?akce=prepis`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.access_token, apikey: SUPABASE_KEY },
        body: JSON.stringify({ recept_id: receptId }),
      });
      const j = await r.json().catch(() => ({ chyba: 'Odpověď není JSON (HTTP ' + r.status + ')' }));
      log('prepis', r.status, j);
      if (!r.ok) throw new Error(j.chyba || ('HTTP ' + r.status));
      return j;
    },
    async url(bucket, cesta) {
      const k = bucket + '/' + cesta; const c = urlCache.get(k);
      if (c && c.do > Date.now()) return c.url;
      const { data, error } = await sb.storage.from(bucket).createSignedUrl(cesta, 3600);
      if (error) { log('url', error); return null; }
      urlCache.set(k, { url: data.signedUrl, do: Date.now() + 3300 * 1000 });
      return data.signedUrl;
    },
  };
}

    async novaOsoba(jmeno) { const o = osoba(jmeno); osoby.push(o); return kopie(o); },
    async novyZdroj(nazev) { const z = { id: id(), nazev }; zdroje.push(z); return kopie(z); },
    async novaKategorie(nazev, rodic_id) { return kopie(kat(nazev, rodic_id, 99)); },
    async prepis() {
      await cekej(1800);
      return { model: 'claude-sonnet-5-5 (ukázka)', cena_kc: 0.31, recept: {
        nazev: 'Koblihy od Štěchů', porce: null,
        skupiny: [{ nazev: null, suroviny: [{ mnozstvi: '50 dkg', cislo: 50, jednotka: 'dkg', surovina: 'hladké mouky', gramy: 500 }, { mnozstvi: '4', cislo: 4, jednotka: null, surovina: 'žloutky', gramy: null }, { mnozstvi: '4 dkg', cislo: 4, jednotka: 'dkg', surovina: 'másla', gramy: 40 }, { mnozstvi: '3 dkg', cislo: 3, jednotka: 'dkg', surovina: 'droždí', gramy: 30 }, { mnozstvi: '2 lžíce', cislo: 2, jednotka: 'lžíce', surovina: 'rumu', gramy: null }, { mnozstvi: '¼ l', cislo: 0.25, jednotka: 'l', surovina: 'mléka', gramy: null }, { mnozstvi: '5 dkg', cislo: 5, jednotka: 'dkg', surovina: 'cukru', gramy: 50 }, { mnozstvi: 'půl malé lžičky', cislo: 0.5, jednotka: 'lžičky', surovina: 'soli', gramy: null }] }],
        postup: ['Utřít máslo, žloutky, cukr, přidat vzkynutý kvásek, mouku a rum.'],
        poznamky: null, nejista: ['Štěchů'], upozorneni: ['Postup končí uprostřed – chybí kynutí, tvarování a smažení.'],
        navrh: { kategorie: 'Pečení', podkategorie: 'Koblihy', autor: 'Štěchovi', stitky: ['Masopust'] },
      } };
    },
    async url(b, c) { const blob = soubory.get(b + '/' + c); if (!blob) return null; blob._url = blob._url || URL.createObjectURL(blob); return blob._url; },
  };
}

const api = DEMO ? vytvorDemoApi() : vytvorSupabaseApi();

// ============================================================
// Stav appky
// ============================================================
const S = {
  nacteno: false, prihlasen: false, clen: null, chybaPrihlaseni: '',
  data: { kategorie: [], osoby: [], zdroje: [], recepty: [], stranky: [], fotky: [] },
  obr: 'domu', zasobnik: [],
  segment: 'kategorie', osoba: null, hledat: '', vysledky: null,
  hlavniId: null, podId: null,
  receptId: null, detail: null, pohled: 'prepis',
  davka: lsGet('kucharka-davka', { autorId: '', zdrojId: '' }),
  strankyRecept: null, k: null, prekryv: null, cekani: null,
};

function jdi(obr, param = {}) { S.zasobnik.push({ obr: S.obr, receptId: S.receptId, hlavniId: S.hlavniId, podId: S.podId }); Object.assign(S, param); S.obr = obr; render(); window.scrollTo(0, 0); }
function zpet() { const p = S.zasobnik.pop() || { obr: 'domu' }; Object.assign(S, p); if (p.obr === 'detail' && S.receptId) otevriDetail(S.receptId, true); else render(); window.scrollTo(0, 0); }
function domu() { S.zasobnik = []; S.obr = 'domu'; render(); window.scrollTo(0, 0); }

const katPodle = (id) => S.data.kategorie.find((k) => k.id === id);
const osobaPodle = (id) => S.data.osoby.find((o) => o.id === id);
const hlavniKat = () => S.data.kategorie.filter((k) => !k.rodic_id).sort((a, b) => a.poradi - b.poradi);
const podKat = (hid) => S.data.kategorie.filter((k) => k.rodic_id === hid).sort((a, b) => a.poradi - b.poradi || a.nazev.localeCompare(b.nazev, 'cs'));
function hlavniProRecept(r) { const k = katPodle(r.kategorie_id); if (!k) return null; return k.rodic_id ? katPodle(k.rodic_id) : k; }
const hotove = () => S.data.recepty.filter((r) => r.stav === 'hotovo' && (!S.osoba || r.autor_id === S.osoba));
const keKontrole = () => S.data.recepty.filter((r) => r.stav === 'ke_kontrole');

async function nactiData() {
  S.data = await api.nactiVse();
  log('data', S.data);
}

// ============================================================
// Vykreslení
// ============================================================
function render() {
  const app = document.getElementById('app');
  let html = '';
  if (!S.nacteno) html = '<div class="prazdne"><span class="ruka">Kuchařka</span>Načítám…</div>';
  else if (!S.prihlasen) html = vLogin();
  else if (S.clen && !S.clen.role) html = vNeniClen();
  else html = ({ domu: vDomu, kategorie: vKategorie, detail: vDetail, pridat: vPridat, stranky: vStranky, kontrola: vKontrola, nastaveni: vNastaveni, nakup: vNakup }[S.obr] || vDomu)();
  if (chyby.length) html += `<div class="chyby">${esc(chyby.join('\n'))}</div>`;
  if (S.obr !== 'kontrola' || !S.prihlasen) html += `<div class="paticka">Kuchařka · verze ${VERZE}${DEMO ? ' · ukázková data' : ''}</div>`;
  app.innerHTML = html;
  vPrekryvy();
  dosadObrazky();
}

async function dosadObrazky(koren = document) {
  for (const img of koren.querySelectorAll('img[data-cesta]')) {
    if (img.dataset.hotovo) continue; img.dataset.hotovo = '1';
    api.url(img.dataset.bucket, img.dataset.cesta).then((u) => { if (u) img.src = u; else img.style.visibility = 'hidden'; });
  }
}
const img = (bucket, cesta, extra = '') => `<img data-bucket="${bucket}" data-cesta="${esc(cesta)}" alt="" ${extra}>`;

function vLogin() {
  return `<div class="login">
    <div style="display:flex;justify-content:center">${IK.vetvicka(56)}</div>
    <h1 style="text-align:center;font-size:48px">Kuchařka</h1>
    <div class="podtitul" style="text-align:center;margin-top:-8px">Rodinné recepty</div>
    <form class="karta" data-form="login">
      <div class="pole"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="pole"><label for="heslo">Heslo</label><input id="heslo" type="password" autocomplete="current-password" required></div>
    </form>
    ${S.chybaPrihlaseni ? `<div class="chyby">${esc(S.chybaPrihlaseni)}</div>` : ''}
    <button class="tlacitko" data-a="prihlasit">Přihlásit</button>
  </div>`;
}
function vNeniClen() {
  return `<div class="login"><h1>Kuchařka</h1><div class="prazdne">Účet <b>${esc(S.clen.email)}</b> zatím není v rodinné kuchařce.<br>Požádej správce, ať tě přidá.</div>
  <button class="tlacitko druhe" data-a="odhlasit">Odhlásit</button></div>`;
}

function radekReceptu(r) {
  const f = S.data.fotky.find((x) => x.recept_id === r.id);
  const s = S.data.stranky.find((x) => x.recept_id === r.id);
  const nahled = f ? img('pokrmy', f.cesta, 'class="nahled"') : s ? img('stranky', s.cesta, 'class="nahled"') : `<span class="nahled">${esc(r.nazev.charAt(0))}</span>`;
  const k = katPodle(r.kategorie_id); const o = osobaPodle(r.autor_id);
  const meta = [o?.jmeno, k?.nazev, r.stav === 'ke_kontrole' ? 'ke kontrole' : ''].filter(Boolean).join(' · ');
  return `<button class="radek" data-a="otevrit" data-id="${r.id}" style="min-height:76px">${nahled}
    <span class="hl"><span class="recept-nazev">${esc(r.nazev)}</span><span class="meta">${esc(meta || 'bez zařazení')}</span></span>${IK.sipka}</button>`;
}

function vDomu() {
  const kk = keKontrole().length;
  const osobyS = S.data.osoby.filter((o) => S.data.recepty.some((r) => r.autor_id === o.id && r.stav === 'hotovo'));
  let telo = '';
  if (S.hledat.trim()) {
    const ids = S.vysledky || [];
    const nal = S.data.recepty.filter((r) => ids.includes(r.id) && (!S.osoba || r.autor_id === S.osoba));
    telo = `<div class="sekce"><div class="nadpis">Nalezeno · ${nal.length}</div>${nal.length ? `<div class="karta">${nal.map(radekReceptu).join('')}</div>` : '<div class="prazdne">Nic nenalezeno.</div>'}</div>`;
  } else if (S.segment === 'kategorie') {
    const rec = hotove();
    telo = `<div class="sekce"><div class="nadpis">Kategorie</div><div class="karta">${hlavniKat().map((h) => {
      const pocet = rec.filter((r) => hlavniProRecept(r)?.id === h.id).length;
      const [bg, fg] = BARVA_KAT[h.nazev] || ['var(--akcent-sv)', 'var(--akcent)'];
      return `<button class="radek" data-a="kategorie" data-id="${h.id}"><span class="dlazdice" style="background:${bg};color:${fg}">${IK_KAT[h.nazev] || IK_KAT['Ostatní']}</span>
        <span class="hl"><span class="nazev">${esc(h.nazev)}</span></span><span class="pocet">${pocet}</span>${IK.sipka}</button>`;
    }).join('')}</div></div>`;
    const posledni = rec.slice(0, 4);
    if (posledni.length) telo += `<div class="sekce"><div class="nadpis">Naposledy přidané</div><div class="mrizka2">${posledni.map((r) => {
      const f = S.data.fotky.find((x) => x.recept_id === r.id); const s = S.data.stranky.find((x) => x.recept_id === r.id);
      const o = osobaPodle(r.autor_id); const k = katPodle(r.kategorie_id);
      const hlava = f ? img('pokrmy', f.cesta) : s ? img('stranky', s.cesta) : `<span style="width:100%;display:flex;justify-content:center">${IK.vetvicka(44)}</span>`;
      return `<button class="karticka" data-a="otevrit" data-id="${r.id}"><span class="hlava">${hlava}</span>
        <span class="telo"><span class="recept-nazev" style="font-size:19px">${esc(r.nazev)}</span><span class="meta" style="font-size:12px;color:var(--text2)">${esc([k?.nazev, o?.jmeno].filter(Boolean).join(' · '))}</span></span></button>`;
    }).join('')}</div></div>`;
    if (!S.data.recepty.length) telo += `<div class="prazdne"><span class="ruka">Zatím prázdno</span>Přidej první recept tlačítkem + vpravo nahoře.</div>`;
  } else if (S.segment === 'vse') {
    const rec = hotove().slice().sort((a, b) => a.nazev.localeCompare(b.nazev, 'cs'));
    telo = rec.length ? `<div class="karta">${rec.map(radekReceptu).join('')}</div>` : '<div class="prazdne">Žádné recepty.</div>';
  } else {
    const rec = keKontrole();
    telo = rec.length ? `<div class="sekce"><div class="nadpis">Čeká na přepis nebo kontrolu</div><div class="karta">${rec.map(radekReceptu).join('')}</div></div>` : '<div class="prazdne"><span class="ruka">Vše hotovo</span>Žádný recept nečeká na kontrolu.</div>';
  }
  return `
  <div class="lista">
    <div style="display:flex;align-items:center;gap:6px;color:var(--text2);font-size:15px">${IK.vetvicka()}<span>Rodinné recepty</span></div>
    <div style="display:flex;gap:4px"><button class="ikonka" data-a="nastaveni" aria-label="Nastavení">${IK.ozubene}</button>
    <button class="ikonka plne" data-a="pridat" aria-label="Přidat recept">${IK.plus}</button></div>
  </div>
  <h1>Kuchařka</h1>
  <div class="hledat">${IK.lupa}<label for="hledat" class="skryty">Hledat recept</label><input id="hledat" type="search" placeholder="Hledat recept, surovinu…" value="${esc(S.hledat)}" autocomplete="off"></div>
  ${S.hledat.trim() ? '' : `<div class="segment">
    <button class="${S.segment === 'kategorie' ? 'vybrano' : ''}" data-a="segment" data-h="kategorie">Kategorie</button>
    <button class="${S.segment === 'vse' ? 'vybrano' : ''}" data-a="segment" data-h="vse">Všechny</button>
    <button class="${S.segment === 'kontrola' ? 'vybrano' : ''}" data-a="segment" data-h="kontrola">Ke kontrole${kk ? ' · ' + kk : ''}</button>
  </div>`}
  ${osobyS.length && S.segment !== 'kontrola' ? `<div class="stitky"><span style="font-size:13px;color:var(--text2);white-space:nowrap">Od koho:</span>
    <button class="stitek ${!S.osoba ? 'vybrano' : ''}" data-a="osoba" data-id="">Všichni</button>
    ${osobyS.map((o) => `<button class="stitek ${S.osoba === o.id ? 'vybrano' : ''}" data-a="osoba" data-id="${o.id}">${esc(o.jmeno)}</button>`).join('')}</div>` : ''}
  ${telo}`;
}

function vKategorie() {
  const h = katPodle(S.hlavniId); if (!h) return vDomu();
  const vsech = hotove().filter((r) => hlavniProRecept(r)?.id === h.id);
  const subs = podKat(h.id).map((p) => ({ p, n: vsech.filter((r) => r.kategorie_id === p.id).length })).filter((x) => x.n);
  const rec = S.podId ? vsech.filter((r) => r.kategorie_id === S.podId) : vsech;
  const o = osobaPodle(S.osoba);
  return `
  <div class="lista"><button class="odkaz" data-a="zpet">${IK.zpet} Kuchařka</button></div>
  <div><h1>${esc(h.nazev)}</h1><div class="podtitul">${pocetRec(vsech.length)}</div></div>
  ${subs.length ? `<div class="stitky"><button class="stitek ${!S.podId ? 'vybrano' : ''}" data-a="pod" data-id="">Vše</button>
    ${subs.map(({ p, n }) => `<button class="stitek ${S.podId === p.id ? 'vybrano' : ''}" data-a="pod" data-id="${p.id}">${esc(p.nazev)} ${n}</button>`).join('')}</div>` : ''}
  ${o ? `<div class="stitky"><span style="font-size:13px;color:var(--text2)">Filtr:</span><button class="stitek lev" data-a="osoba" data-id="">Od: ${esc(o.jmeno)} ${IK.krizek}</button></div>` : ''}
  ${rec.length ? `<div class="karta">${rec.map(radekReceptu).join('')}</div>` : '<div class="prazdne">V této kategorii zatím nic není.</div>'}`;
}

async function otevriDetail(id, bezZasobniku) {
  S.cekani = null;
  const d = await api.detail(id);
  if (d.stav === 'ke_kontrole') {
    if (!bezZasobniku) S.zasobnik.push({ obr: S.obr, receptId: S.receptId, hlavniId: S.hlavniId, podId: S.podId });
    S.receptId = id;
    if (d.navrh || d.suroviny.length) { S.k = zKontroly(d); S.obr = 'kontrola'; }
    else { S.strankyRecept = d; S.obr = 'stranky'; }
    render(); window.scrollTo(0, 0); return;
  }
  S.detail = d; S.pohled = 'prepis';
  if (bezZasobniku) { S.receptId = id; S.obr = 'detail'; render(); } else jdi('detail', { receptId: id });
}

function seskup(suroviny) {
  const g = [];
  for (const s of suroviny.slice().sort((a, b) => a.poradi - b.poradi)) {
    const posl = g[g.length - 1];
    if (posl && posl.nazev === (s.skupina || null)) posl.suroviny.push(s); else g.push({ nazev: s.skupina || null, suroviny: [s] });
  }
  return g;
}

function vDetail() {
  const d = S.detail; if (!d) return '';
  const k = katPodle(d.kategorie_id); const h = k?.rodic_id ? katPodle(k.rodic_id) : null; const o = osobaPodle(d.autor_id);
  const f = d.fotky[0];
  const stitky = [
    k ? `<span class="stitek info lev">${esc(h ? h.nazev + ' › ' + k.nazev : k.nazev)}</span>` : '',
    o ? `<span class="stitek info ruz">od: ${esc(o.jmeno)}</span>` : '',
    d.porce ? `<span class="stitek info sal">${esc(d.porce)}</span>` : '',
    ...(d.stitky || []).map((t) => `<span class="stitek info sal">${esc(t)}</span>`),
  ].join('');
  const telo = S.pohled === 'original'
    ? (d.stranky.length ? d.stranky.map((s) => `<div class="karta" data-a="original" style="cursor:zoom-in">${img('stranky', s.cesta, 'style="width:100%;display:block"')}</div>`).join('') : '<div class="prazdne">Recept nemá vyfocené stránky.</div>')
    : `${d.upozorneni?.length ? `<div class="varovani">${d.upozorneni.map((u) => `<div class="r">${IK.pozor}<span>${esc(u)}</span></div>`).join('')}</div>` : ''}
      ${d.suroviny.length ? `<div class="sekce"><div class="nadpis">Suroviny</div><div class="karta">${seskup(d.suroviny).map((g) => `${g.nazev ? `<div class="skupina-nadpis">${esc(g.nazev)}</div>` : ''}${g.suroviny.map((s) => `<div class="surovina"><span class="mn">${esc(s.mnozstvi)}${s.gramy && !/^\s*[\d.,]+\s*g\s*$/.test(s.mnozstvi || '') ? `<span class="g">${esc(String(s.gramy).replace('.', ','))} g</span>` : ''}</span><span>${esc(s.surovina)}</span></div>`).join('')}`).join('')}</div></div>` : ''}
      ${d.postup?.length ? `<div class="sekce"><div class="nadpis">Postup</div><div class="karta" style="padding:8px 14px">${d.postup.map((t, i) => `<div class="krok"><span class="c">${i + 1}</span><span class="t">${esc(t)}</span></div>`).join('')}</div></div>` : ''}
      ${d.poznamky ? `<div class="papir"><div class="nad">POZNÁMKA Z KUCHAŘKY</div><div class="ruka">${esc(d.poznamky)}</div></div>` : ''}`;
  return `
  <div class="lista"><button class="odkaz" data-a="zpet">${IK.zpet} Zpět</button><button class="odkaz" data-a="upravit">Upravit</button></div>
  <div style="display:flex;gap:12px;align-items:center">
    <h1 class="mensi" style="flex:1;min-width:0">${esc(d.nazev)}</h1>
    ${f ? `<button class="foto-pokrmu ma" data-a="fotky" aria-label="Fotky pokrmu">${img('pokrmy', f.cesta)}</button>`
        : `<label class="foto-pokrmu" aria-label="Přidat fotku hotového pokrmu">${IK.fotoPlus}<span>Foto<br>pokrmu</span><input class="skryty" type="file" accept="image/*" data-vstup="fotka"></label>`}
  </div>
  ${stitky ? `<div class="stitky" style="flex-wrap:wrap">${stitky}</div>` : ''}
  <div class="segment"><button class="${S.pohled === 'prepis' ? 'vybrano' : ''}" data-a="pohled" data-h="prepis">Přepis</button>
    <button class="${S.pohled === 'original' ? 'vybrano' : ''}" data-a="pohled" data-h="original">Originál${d.stranky.length ? ' (' + d.stranky.length + ' str.)' : ''}</button></div>
  ${telo}
  ${d.suroviny.length ? `<button class="tlacitko" data-a="nakup" style="margin-top:4px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2.2 11h10.6L20 7H6.3M9.5 19.5a1 1 0 1 0 0 .1M16.5 19.5a1 1 0 1 0 0 .1" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg> Nákupní seznam</button>` : ''}
  ${S.clen?.role === 'spravce' ? '<button class="tlacitko cervene" data-a="smazat">Smazat recept</button>' : ''}`;
}

function vPridat() {
  const os = S.data.osoby; const zd = S.data.zdroje;
  return `
  <div class="lista"><button class="odkaz" data-a="zpet">Zrušit</button><span class="stred">Nový recept</span><span style="width:52px"></span></div>

  </div></div>
  <div class="sekce"><div class="nadpis">Výchozí pro celou dávku</div><div class="karta">
    <div class="pole"><label for="davka-autor">Od koho</label><select id="davka-autor" data-davka="autorId">
      <option value="">— navrhne AI —</option>${os.map((o) => `<option value="${o.id}" ${S.davka.autorId === o.id ? 'selected' : ''}>${esc(o.jmeno)}</option>`).join('')}<option value="+">+ Nová osoba…</option></select></div>
    <div class="pole"><label for="davka-zdroj">Zdroj</label><select id="davka-zdroj" data-davka="zdrojId">

// ---------- Nákupní seznam ----------
const ODDELENI = [
  ['Mléčné a vejce', /(vejc|vajec|zloutk|bilk|masl|mlek|mlik|tvaroh|smetan|jogurt|syr|kefir|podmasl)/],
  ['Mouka a pečení', /(mouk|cukr|prasek|prasku|drozd|kvasnic|vanil|kakao|kokos|mak|orech|mandl|pudink|skorice|rozink|zelatin|perni|citronov[aá] kura)/],
  ['Ovoce a zelenina', /(cibul|cesnek|cuket|paprik|mrkev|mrkv|brambor|jabl|citron|hrusk|svestk|merunk|jahod|rajc|okurk|zeli|petrzel|celer|houb|kopr|patizon|dyn)/],
  ['Maso a uzeniny', /(maso|masa|kure|vepr|hoveze|slanin|klobas|sunk|parek|mlet)/],
];
function zakladSuroviny(nazev) {
  const n = bezDiakritiky(nazev).trim();
  if (/(zloutk|zloutek|bilk|bilek|vejc|vajec|vejce)/.test(n)) return { klic: 'vejce', nazev: 'Vejce' };
  if (/^(cukr|cukru)\b/.test(n)) return { klic: 'cukr', nazev: 'Cukr' };
  if (/^(masla|maslo)\b/.test(n)) return { klic: 'maslo', nazev: 'Máslo' };
  if (/\bml[ei]k[ao]?\b/.test(n)) return { klic: 'mleko', nazev: 'Mléko' };
  if (/mouk/.test(n)) { const d = /polohrub/.test(n) ? 'Polohrubá mouka' : /hrub/.test(n) ? 'Hrubá mouka' : /hladk/.test(n) ? 'Hladká mouka' : /celozrn/.test(n) ? 'Celozrnná mouka' : 'Mouka'; return { klic: bezDiakritiky(d), nazev: d }; }
  if (/(prasek|prasku) do peciva/.test(n)) return { klic: 'prasek', nazev: 'Prášek do pečiva' };
  if (/^vanilk/.test(n)) return { klic: 'vanilka', nazev: 'Vanilkový cukr' };
  if (/^(soli|sul)\b/.test(n)) return { klic: 'sul', nazev: 'Sůl' };
  if (/^(tvarohu|tvaroh)\b/.test(n)) return { klic: 'tvaroh', nazev: 'Tvaroh' };
  if (/^(kokosu|kokos)\b/.test(n)) return { klic: 'kokos', nazev: 'Kokos' };
  if (/^(drozdi)\b/.test(n)) return { klic: 'drozdi', nazev: 'Droždí' };
  const hezky = nazev.trim().charAt(0).toUpperCase() + nazev.trim().slice(1);
  return { klic: n, nazev: hezky };
}
function cisloZ(m) {
  const t = String(m || '').replace(',', '.').trim();
  const zl = { '¼': .25, '½': .5, '¾': .75, '⅓': 1 / 3, '⅔': 2 / 3 };
  let x = t.match(/^(\d+(?:\.\d+)?)?\s*([¼½¾⅓⅔])?/);
  if (!x || (!x[1] && !x[2])) return null;
  return (x[1] ? parseFloat(x[1]) : 0) + (x[2] ? zl[x[2]] : 0);
}
function sestavNakup(suroviny) {
  const mapa = new Map(); let zl = 0, bi = 0, vc = 0, vejceZdroj = [];
  for (const s0 of suroviny) {
    // „⅓ skleničky mléka“ → množství „⅓ skleničky“, surovina „mléka“
    const s = { ...s0 };
    const mira = String(s.surovina || '').match(/^(skleni\S*|hrnk\S*|hrnek|lž[ií]c\S*|lžičk\S*|sáčk\S*|sáček|balíč\S*|špetk\S*|kousk\S*|kousek)\s+(.+)$/i);
    if (mira) { s.mnozstvi = ((s.mnozstvi || '') + ' ' + mira[1]).trim(); s.surovina = mira[2]; }
    const z = zakladSuroviny(s.surovina);
    if (z.klic === 'vejce') {
      const n = cisloZ(s.mnozstvi) ?? 1; const t = bezDiakritiky(s.surovina);
      if (/zlout/.test(t)) zl += n; else if (/bil/.test(t)) bi += n; else vc += n;
      vejceZdroj.push((s.mnozstvi ? s.mnozstvi + ' ' : '') + s.surovina);
      continue;
    }
    const p = mapa.get(z.klic) || { nazev: z.nazev, gramy: 0, maGramy: true, kusy: [], puvod: [] };
    if (s.gramy) p.gramy += Number(s.gramy); else { p.maGramy = p.maGramy && false; p.kusy.push(s.mnozstvi || ''); }
    p.puvod.push((s.mnozstvi ? s.mnozstvi + ' ' : '') + s.surovina);
    mapa.set(z.klic, p);
  }
  const vysl = [];
  if (zl || bi || vc) vysl.push({ klic: 'vejce', nazev: 'Vejce', vejce: vc + Math.max(zl, bi), pozn: vejceZdroj.length > 1 ? vejceZdroj.join(' + ') : '' });
  for (const [klic, p] of mapa) vysl.push({ klic, nazev: p.nazev, gramy: p.gramy || null, kusy: p.kusy.filter(Boolean), pozn: p.puvod.length > 1 ? p.puvod.join(' + ') : '' });
  return vysl;
}
function mnozstviNakup(x, nas) {
  const fr = (v) => {
    const c = Math.floor(v + 1e-6); const r = v - c;
    const zl = Math.abs(r - 1 / 3) < 0.02 ? '⅓' : Math.abs(r - 2 / 3) < 0.02 ? '⅔' : ({ 0.25: '¼', 0.5: '½', 0.75: '¾' }[Math.round(r * 4) / 4] || '');
    if (r > 0.02 && !zl) return String(Math.round(v * 100) / 100).replace('.', ',');
    return ((c ? String(c) : '') + zl) || '0';
  };
  if (x.vejce) return fr(x.vejce * nas) + ' ks';
  const casti = [];
  if (x.gramy) { const g = x.gramy * nas; casti.push(g >= 1000 ? String(Math.round(g / 10) / 100).replace('.', ',') + ' kg' : Math.round(g) + ' g'); }
  for (const k of x.kusy) { const c = cisloZ(k); casti.push(c != null && nas > 1 ? k.replace(/^\s*[\d.,]*\s*[¼½¾⅓⅔]?/, fr(c * nas)) : (nas > 1 ? k + ' ×' + nas : k)); }
  return casti.join(' + ');
}
function vNakup() {
  const d = S.detail; if (!d) return '';
  const nas = S.nakupNasobek || 1; const mam = S.nakupMam || {};
  const pol = sestavNakup(d.suroviny);
  const skupiny = new Map(); for (const [n] of ODDELENI) skupiny.set(n, []); skupiny.set('Ostatní', []);
  for (const x of pol) { const t = bezDiakritiky(x.nazev); const o = ODDELENI.find(([, re]) => re.test(t)); skupiny.get(o ? o[0] : 'Ostatní').push(x); }
  const zbyva = pol.filter((x) => !mam[x.klic]).length;
  return `
  <div class="lista"><button class="odkaz" data-a="zpet">${IK.zpet} Recept</button><span class="stred">Nákupní seznam</span><span style="width:70px"></span></div>
  <div><h1 class="mensi">${esc(d.nazev)}</h1><div class="podtitul">Klepnutím odškrtni, co máš doma.</div></div>
  <div class="karta" style="display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 14px">
    <span>Množství: <b>${nas}×</b> recept${d.porce ? ` <span style="color:var(--text2)">(${esc(d.porce)})</span>` : ''}</span>
    <span class="krokovac"><button data-a="nasobek" data-o="-1" aria-label="Méně">−</button><button data-a="nasobek" data-o="1" aria-label="Více">+</button></span>
  </div>
  ${[...skupiny].filter(([, l]) => l.length).map(([n, l]) => `<div class="sekce"><div class="nadpis">${esc(n)}</div><div class="karta">
    ${l.map((x) => `<button class="nakup-radek ${mam[x.klic] ? 'mam' : ''}" data-a="mam" data-k="${esc(x.klic)}" aria-pressed="${!!mam[x.klic]}">
      ${mam[x.klic] ? '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" style="flex-shrink:0"><circle cx="11" cy="11" r="10" fill="var(--text3)"/><path d="M6.5 11.5l3 3 6-6.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" style="flex-shrink:0"><circle cx="11" cy="11" r="9.5" stroke="var(--akcent)" stroke-width="1.6" fill="none"/></svg>'}
      <span class="hl"><span class="nazev">${esc(x.nazev)}</span>${x.pozn ? `<span style="font-size:12px;color:var(--text2)">${esc(x.pozn)}</span>` : ''}</span>
      <span class="mn">${esc(mnozstviNakup(x, nas))}</span></button>`).join('')}</div></div>`).join('')}
  <button class="tlacitko" data-a="poslatNakup" ${zbyva ? '' : 'disabled'}><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M6 11H4v10h16V11h-2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg> Poslat seznam · ${zbyva} ${zbyva === 1 ? 'položka' : zbyva >= 2 && zbyva <= 4 ? 'položky' : 'položek'}</button>
  <button class="tlacitko tiche" data-a="kopirovatNakup">Kopírovat seznam</button>`;
}
function textNakupu() {
  const d = S.detail; const nas = S.nakupNasobek || 1; const mam = S.nakupMam || {};
  const radky = sestavNakup(d.suroviny).filter((x) => !mam[x.klic]).map((x) => '☐ ' + x.nazev + (mnozstviNakup(x, nas) ? ' – ' + mnozstviNakup(x, nas) : ''));
  return 'Nákup: ' + d.nazev + (nas > 1 ? ' (' + nas + '×)' : '') + '\n' + radky.join('\n');
}

// ============================================================
// Akce
// ============================================================
let hledatCas;
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'hledat') {
    S.hledat = t.value; clearTimeout(hledatCas);
    hledatCas = setTimeout(async () => {
      S.vysledky = S.hledat.trim() ? await api.hledej(S.hledat.trim()) : null;
      const pos = t.selectionStart; render(); const n = document.getElementById('hledat'); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
    }, 250);
    return;
  }
  const k = S.k; if (!k) return;
  if (t.dataset.k && t.tagName !== 'SELECT') k[t.dataset.k] = t.value;
  else if (t.dataset.sk != null) k.skupiny[+t.dataset.sk].nazev = t.value;
  else if (t.dataset.sm) { const [g, i] = t.dataset.sm.split('.').map(Number); const s = k.skupiny[g].suroviny[i]; s.mnozstvi = t.value; s.cislo = null; s.jednotka = null; s.gramy = prepoctiGramy(t.value); }
  else if (t.dataset.ss) { const [g, i] = t.dataset.ss.split('.').map(Number); k.skupiny[g].suroviny[i].surovina = t.value; }
  else if (t.dataset.kp != null) k.postup[+t.dataset.kp] = t.value;
});

function prepoctiGramy(m) {
  const x = String(m).replace(',', '.').match(/^\s*([\d.]+)\s*(dkg|kg|g)\b/i);
  if (!x) return null; const n = parseFloat(x[1]); const u = x[2].toLowerCase();
  return u === 'dkg' ? n * 10 : u === 'kg' ? n * 1000 : n;
}

document.addEventListener('change', async (e) => {
  const t = e.target;
  try {
    if (t.dataset.davka) {
      let v = t.value;
      if (v === '+') {
        const jm = prompt(t.dataset.davka === 'autorId' ? 'Jméno osoby (např. Babička Marie):' : 'Název zdroje (např. Kuchařka s paprikami):');
        if (!jm?.trim()) { render(); return; }
        const n = t.dataset.davka === 'autorId' ? await api.novaOsoba(jm.trim()) : await api.novyZdroj(jm.trim());
        await nactiData(); v = n.id;
      }
      S.davka[t.dataset.davka] = v; lsSet('kucharka-davka', S.davka); render(); return;
    }
    if (t.dataset.k && t.tagName === 'SELECT' && S.k) {
      const k = S.k; const pole = t.dataset.k;
      if (pole === 'hlavniId') { k.hlavniId = t.value || null; k.podId = ''; k.podNova = ''; render(); return; }
      if (pole === 'podId' && t.value === '+') { const n = prompt('Název nové podkategorie:', k.podNova || ''); if (n?.trim()) { k.podId = '+'; k.podNova = n.trim(); } render(); return; }
      if (pole === 'autorId' && t.value === '+') { const n = prompt('Jméno osoby:', k.autorNovy || ''); if (n?.trim()) { k.autorId = '+'; k.autorNovy = n.trim(); } render(); return; }
      k[pole] = t.value; return;
    }
    if (t.dataset.vstup && t.files?.length) {
      const soubory = [...t.files]; t.value = '';
      if (t.dataset.vstup === 'novaStrana') await novyReceptZFotek(soubory);
      else if (t.dataset.vstup === 'dalsiStrana') await pridejStrany(soubory);
      else if (t.dataset.vstup === 'fotka') await pridejFotkuPokrmu(soubory[0]);
    }
  } catch (err) { S.cekani = null; zapisChybu(err.message || err); toast('Chyba: ' + (err.message || err)); }
});

async function novyReceptZFotek(soubory) {
  S.cekani = { nadpis: 'Nahrávám stránky…' }; vPrekryvy();
  const autor = S.davka.autorId && S.davka.autorId !== '+' ? S.davka.autorId : null;
  const zdroj = S.davka.zdrojId && S.davka.zdrojId !== '+' ? S.davka.zdrojId : null;
  const id = await api.novyRecept({ nazev: 'Nový recept', autor_id: autor, zdroj_id: zdroj, stav: 'ke_kontrole' });
  for (const [i, f] of soubory.entries()) await api.pridejStranku(id, await zmensi(f), i);
  await nactiData();
  S.strankyRecept = await api.detail(id); S.receptId = id; S.cekani = null;
  S.zasobnik = [{ obr: 'domu' }]; S.obr = 'stranky'; render(); window.scrollTo(0, 0);
}
async function pridejStrany(soubory) {
  const d = S.strankyRecept || (S.k && { id: S.k.id, stranky: S.k.stranky }); if (!d) return;
  S.cekani = { nadpis: 'Nahrávám…' }; vPrekryvy();
  let p = d.stranky.length;
  for (const f of soubory) await api.pridejStranku(d.id, await zmensi(f), p++);
  S.strankyRecept = await api.detail(d.id); S.cekani = null; await nactiData(); S.obr = 'stranky'; render();
}
async function pridejFotkuPokrmu(f) {
  const d = S.detail; if (!d) return;
  S.cekani = { nadpis: 'Nahrávám fotku…' }; vPrekryvy();
  await api.pridejFotku(d.id, await zmensi(f, 1400), d.fotky.length);
  S.detail = await api.detail(d.id); await nactiData(); S.cekani = null;
  if (S.prekryv) S.prekryv.polozky = S.detail.fotky;
  render(); toast('Fotka pokrmu přidána');
}

async function prepsat(id) {
  S.cekani = { nadpis: 'Čtu rukopis…', text: 'Obvykle to trvá 10–40 sekund.' }; vPrekryvy();
  try {
    const v = await api.prepis(id); const r = v.recept;
    const suroviny = [];
    for (const g of r.skupiny || []) for (const s of g.suroviny || []) suroviny.push({ skupina: g.nazev || null, mnozstvi: s.mnozstvi, cislo: s.cislo, jednotka: s.jednotka, surovina: s.surovina, gramy: s.gramy });
    await api.ulozRecept(id, { nazev: r.nazev || 'Nový recept', porce: r.porce, postup: r.postup || [], poznamky: r.poznamky, nejista: r.nejista || [], upozorneni: r.upozorneni || [], stitky: r.navrh?.stitky || [], navrh: r.navrh, ai_model: v.model, ai_cena_kc: v.cena_kc }, suroviny);
    await nactiData();
    const d = await api.detail(id);
    S.k = zKontroly(d); S.k.novy = true; S.cekani = null; S.obr = 'kontrola'; render(); window.scrollTo(0, 0);
  } catch (e) {
    S.cekani = null; render(); zapisChybu('Přepis: ' + (e.message || e)); toast('Přepis se nepovedl – recept zůstal ve frontě Ke kontrole');
  }
}

async function ulozitKontrolu() {
  const k = S.k;
  if (!k.nazev.trim()) { toast('Doplň název receptu'); document.getElementById('k-nazev')?.focus(); return; }
  S.cekani = { nadpis: 'Ukládám…' }; vPrekryvy();
  try {
    let katId = null;
    if (k.hlavniId) {
      katId = k.hlavniId;
      if (k.podId === '+' && k.podNova) katId = (podKat(k.hlavniId).find((p) => bezDiakritiky(p.nazev) === bezDiakritiky(k.podNova)) || await api.novaKategorie(k.podNova, k.hlavniId)).id;
      else if (k.podId) katId = k.podId;
    }
    let autorId = k.autorId || null;
    if (autorId === '+') autorId = k.autorNovy ? (S.data.osoby.find((o) => bezDiakritiky(o.jmeno) === bezDiakritiky(k.autorNovy)) || await api.novaOsoba(k.autorNovy)).id : null;
    const suroviny = [];
    for (const g of k.skupiny) for (const s of g.suroviny) if (s.surovina.trim() || s.mnozstvi.trim()) suroviny.push({ skupina: g.nazev.trim() || null, mnozstvi: s.mnozstvi.trim(), cislo: s.cislo ?? null, jednotka: s.jednotka ?? null, surovina: s.surovina.trim() || '?', gramy: s.gramy ?? prepoctiGramy(s.mnozstvi) });
    await api.ulozRecept(k.id, {
      nazev: k.nazev.trim(), porce: k.porce.trim() || null, kategorie_id: katId, autor_id: autorId, zdroj_id: k.zdrojId || null,
      stitky: k.stitky.split(',').map((x) => x.trim()).filter(Boolean), postup: k.postup.map((x) => x.trim()).filter(Boolean),
      poznamky: k.poznamky.trim() || null, nejista: k.nejista, upozorneni: k.upozorneni, stav: 'hotovo',
    }, suroviny);
    await nactiData();
    S.k = null; S.cekani = null; S.zasobnik = [{ obr: 'domu' }];
    await otevriDetail(k.id, true); toast('Recept uložen');
  } catch (e) { S.cekani = null; render(); zapisChybu(e.message || e); toast('Uložení se nepovedlo'); }
}

document.addEventListener('submit', (e) => { e.preventDefault(); document.querySelector('[data-a="prihlasit"]')?.click(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'heslo') { e.preventDefault(); document.querySelector('[data-a="prihlasit"]')?.click(); } });

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a; const k = S.k;
  try {
    switch (a) {
      case 'prihlasit': {
        S.chybaPrihlaseni = '';
        try { await api.prihlasit(document.getElementById('email').value.trim(), document.getElementById('heslo').value); await start(); }
        catch (err) { S.chybaPrihlaseni = err.message === 'Invalid login credentials' ? 'Nesprávný e-mail nebo heslo.' : err.message; render(); }
        break;
      }
      case 'odhlasit': await api.odhlasit(); S.prihlasen = false; S.clen = null; domu(); break;
      case 'zpet': S.k = null; zpet(); break;
      case 'nastaveni': jdi('nastaveni'); break;
      case 'pridat': jdi('pridat'); break;
      case 'segment': S.segment = el.dataset.h; render(); break;
      case 'osoba': S.osoba = el.dataset.id || null; render(); break;
      case 'kategorie': jdi('kategorie', { hlavniId: el.dataset.id, podId: null }); break;
      case 'pod': S.podId = el.dataset.id || null; render(); break;
      case 'otevrit': await otevriDetail(el.dataset.id); break;
      case 'pohled': S.pohled = el.dataset.h; render(); break;
      case 'upravit': S.k = zKontroly(S.detail); S.k.novy = false; jdi('kontrola'); break;
      case 'smazat':
        if (el.dataset.potvrzeno) { await api.smazRecept(S.detail.id); await nactiData(); domu(); toast('Recept smazán'); }
        else { el.dataset.potvrzeno = '1'; el.textContent = 'Opravdu smazat? Klepni znovu'; }
        break;
      case 'zahodit':
        if (el.dataset.potvrzeno) { await api.smazRecept(S.strankyRecept.id); await nactiData(); domu(); toast('Zahozeno'); }
        else { el.dataset.potvrzeno = '1'; el.textContent = 'Opravdu zahodit? Klepni znovu'; }
        break;
      case 'fotky': S.prekryv = { nadpis: 'Fotky pokrmu', bucket: 'pokrmy', polozky: S.detail.fotky, pridat: true, mazani: true }; vPrekryvy(); break;
      case 'original': {
        const st = S.obr === 'kontrola' ? k.stranky : S.obr === 'stranky' ? S.strankyRecept.stranky : S.detail.stranky;
        S.prekryv = { nadpis: 'Originál · klepnutím přiblížíš', bucket: 'stranky', polozky: st }; vPrekryvy(); break;
      }
      case 'zoom': el.classList.toggle('zoom'); break;
      case 'zavritPrekryv': S.prekryv = null; vPrekryvy(); break;
      case 'smazFotku':
        if (el.dataset.potvrzeno) { await api.smazFotku(S.prekryv.polozky[+el.dataset.i]); S.detail = await api.detail(S.detail.id); await nactiData(); S.prekryv.polozky = S.detail.fotky; if (!S.detail.fotky.length) S.prekryv = null; render(); }
        else { el.dataset.potvrzeno = '1'; el.textContent = 'Opravdu smazat? Klepni znovu'; }
        break;
      case 'otocit': {
        const s = S.strankyRecept.stranky[+el.dataset.i];
        S.cekani = { nadpis: 'Otáčím…' }; vPrekryvy();
        const blob = await api.stahni('stranky', s.cesta); await api.prepisSoubor('stranky', s.cesta, await otoc(blob));
        S.cekani = null; render(); break;
      }
      case 'posun': {
        const st = S.strankyRecept.stranky; const i = +el.dataset.i; const j = i + +el.dataset.o;
        [st[i], st[j]] = [st[j], st[i]]; await api.poradiStranek(st); render(); break;
      }
      case 'smazStranu': {
        const st = S.strankyRecept.stranky; const s = st[+el.dataset.i];
        if (!el.dataset.potvrzeno) { el.dataset.potvrzeno = '1'; el.style.background = 'var(--ruze-sv)'; toast('Klepni znovu pro smazání stránky'); break; }
        await api.smazStranku(s); st.splice(+el.dataset.i, 1); await api.poradiStranek(st); await nactiData(); render(); break;
      }
      case 'prepsat': await prepsat(S.strankyRecept.id); break;
      case 'prepsatZnovu': await prepsat(k.id); break;
      case 'pozdeji': await nactiData(); domu(); toast('Recept čeká ve frontě Ke kontrole'); break;
      case 'pridatStranu': S.strankyRecept = await api.detail(k.id); S.k = null; S.obr = 'stranky'; render(); window.scrollTo(0, 0); break;
      case 'potvrdNejiste': k.nejista.splice(+el.dataset.i, 1); render(); break;
      case 'smazUpoz': k.upozorneni.splice(+el.dataset.i, 1); render(); break;
      case 'pridejSurovinu': k.skupiny[+el.dataset.g].suroviny.push({ mnozstvi: '', surovina: '' }); render(); document.querySelector(`[data-sm="${el.dataset.g}.${k.skupiny[+el.dataset.g].suroviny.length - 1}"]`)?.focus(); break;
      case 'smazSurovinu': k.skupiny[+el.dataset.g].suroviny.splice(+el.dataset.i, 1); render(); break;
      case 'pridejSkupinu': k.skupiny.push({ nazev: '', suroviny: [{ mnozstvi: '', surovina: '' }] }); render(); break;
      case 'smazSkupinu': k.skupiny.splice(+el.dataset.g, 1); if (!k.skupiny.length) k.skupiny.push({ nazev: '', suroviny: [{ mnozstvi: '', surovina: '' }] }); render(); break;
      case 'pridejKrok': k.postup.push(''); render(); document.querySelector(`[data-kp="${k.postup.length - 1}"]`)?.focus(); break;
      case 'smazKrok': k.postup.splice(+el.dataset.i, 1); if (!k.postup.length) k.postup.push(''); render(); break;
      case 'ulozit': await ulozitKontrolu(); break;
      case 'nakup': S.nakupNasobek = 1; S.nakupMam = {}; jdi('nakup', { receptId: S.detail.id }); break;
      case 'nasobek': S.nakupNasobek = Math.min(10, Math.max(1, (S.nakupNasobek || 1) + +el.dataset.o)); render(); break;
      case 'mam': S.nakupMam = { ...S.nakupMam, [el.dataset.k]: !S.nakupMam[el.dataset.k] }; render(); break;
      case 'poslatNakup': {
        const t = textNakupu();
        if (navigator.share) { try { await navigator.share({ title: 'Nákupní seznam', text: t }); } catch (err) { if (err.name !== 'AbortError') throw err; } }
        else { await navigator.clipboard.writeText(t); toast('Seznam zkopírován – vlož ho do zprávy'); }
        break;
      }
      case 'kopirovatNakup': await navigator.clipboard.writeText(textNakupu()); toast('Seznam zkopírován'); break;
    }
  } catch (err) { S.cekani = null; vPrekryvy(); zapisChybu(err.message || err); toast('Chyba: ' + (err.message || err)); }
});

// ============================================================
// Start
// ============================================================
async function start() {
  try {
    const rel = await api.relace();
    S.prihlasen = !!rel;
    if (S.prihlasen) {
      S.clen = await api.clen();
      if (S.clen?.role) await nactiData();
    }
  } catch (e) { zapisChybu(e.message || e); }
  S.nacteno = true; render();
}
if ('serviceWorker' in navigator && !DEMO && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
start();
</script>
